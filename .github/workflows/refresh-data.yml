# replaces this stub once that's merged. Deliberately NO schedule trigger
# here: this stub's own steps reference scripts that don't exist on
# `main` yet, so it must never fire on its own, only via workflow_dispatch
# with an explicit --ref pointing at a branch that has the real pipeline.
name: Refresh OSM data

